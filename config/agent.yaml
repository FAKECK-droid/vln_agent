tool_manager:
  max_concurrent_calls: 4
  max_pending_calls: 64
  groups:
    - id: navigation
      definition: ../plugins/tools/navigation/tool.json
      settings:
        action_name: /navigate_to_pose
        local_costmap_service: /local_costmap/get_costmap
        global_costmap_service: /global_costmap/get_costmap
        map_frame: map
        base_frame: base_link
        costmap_timeout_sec: 2.0
        image_size: 512
        max_environments: 8
      functions:
        - name: navigate_to_pose_start_navigation
          plugin: vln_agent/NavigateToPoseStartNavigation
          blocking: true
        - name: navigate_to_pose_get_feedback
          plugin: vln_agent/NavigateToPoseGetFeedback
          blocking: false
        - name: navigate_to_pose_cancel_navigation
          plugin: vln_agent/NavigateToPoseCancelNavigation
          blocking: true
        - name: get_surroundings
          plugin: vln_agent/GetSurroundings
          blocking: false
        - name: navigate_to_pixel_start_navigation
          plugin: vln_agent/NavigateToPixelStartNavigation
          blocking: true
    - id: capture_image
      definition: ../plugins/tools/capture_image/tool.json
      settings:
        service_name: /rgbd_image_queue/get_image
      functions:
        - name: capture_image
          plugin: vln_agent/CaptureImage
          blocking: false
          settings:
            timeout_sec: 2.0


session_manager:
  base_url: "http://192.168.3.25:8317/v1"
  api_key: "sk-local-1gHIUqOELWgeLmW5AocUxtxGo7DWRlUBed1xu-35"  # 实际密钥请填写 config/agent.local.yaml（不提交）
  model: "gpt-6.1-terra"
  store: true
  reasoning_effort: low
  max_output_tokens: 8192
  parallel_tool_calls: true
  prompt_cache_key: "scout-mini-vln"
  max_request_hz: 5.0
  request_timeout_sec: 0
  stream_output: true
  context:
    budget_tokens: 128000
    compact_ratio: 0.8


# 用户渠道分别选择传输字段；同步 exchange，无交互工作线程。
user_interaction:
  channels:
    - id: ros_ui
      plugin: vln_agent/RosTopicInterface
      transmit:
        request: true
        response:
          messages: true
          function_calls: true
          tool_outputs: true
          stream: true
        tools:
          definitions: true
          status: true
          queue: true
          finished_calls: true
        session:
          request_status: true
          context_status: true
      include_images: false
      settings:
        send_topic: /vln/user_output
        receive_topic: /vln/user_input

event_manager:
  receive_topic: /vln/robot_event
