tool_manager:
  service_name: /vln/tool_call
  max_concurrent_calls: 4
  max_pending_calls: 64
  groups:
    - id: navigation
      definition: ../plugins/tools/navigation/tool.json
      settings:
        action_name: /navigate_to_pose
        navigate_through_poses_action_name: /navigate_through_poses
        navigate_through_poses_behavior_tree: /home/yan/ros2_ws/src/scout_mini_vln/vln_behavior_tree/behavior_trees/vln_navthroughgoals.xml
        lookaround_behavior_tree: ""  # 空值使用 vln_behavior_tree 安装目录中的 behavior_trees/lookaround.xml
        local_costmap_service: /local_costmap/get_costmap
        global_costmap_service: /global_costmap/get_costmap
        map_frame: map
        base_frame: base_link
        costmap_timeout_sec: 2.0
        image_size: 512
        max_environments: 8
        max_pixel_goals: 8  # 单次多点像素导航的最大点数，必须为正整数
      functions:
        - name: navigate_to_pose_start_navigation
          plugin: vln_agent/NavigateToPoseStartNavigation
          blocking: true
        - name: navigate_to_pose_get_feedback
          plugin: vln_agent/NavigateToPoseGetFeedback
          blocking: false
        - name: navigate_to_pose_cancel_navigation
          plugin: vln_agent/NavigateToPoseCancelNavigation
          blocking: true
        - name: navigate_through_poses_start_navigation
          plugin: vln_agent/NavigateThroughPosesStartNavigation
          blocking: true
        - name: navigate_through_poses_get_feedback
          plugin: vln_agent/NavigateThroughPosesGetFeedback
          blocking: false
        - name: navigate_through_poses_cancel_navigation
          plugin: vln_agent/NavigateThroughPosesCancelNavigation
          blocking: true
        - name: get_surroundings
          plugin: vln_agent/GetSurroundings
          blocking: false
        - name: navigate_to_pixel_start_navigation
          plugin: vln_agent/NavigateToPixelStartNavigation
          blocking: true
        - name: navigate_through_pixels_start_navigation
          plugin: vln_agent/NavigateThroughPixelsStartNavigation
          blocking: true
        - name: navigate_to_objects
          plugin: vln_agent/NavigateToObjects
          blocking: true
          settings:
            rgbd_resource: rgbd/rgbd
        - name: start_lookaround
          plugin: vln_agent/StartLookaround
          blocking: true
        - name: cancel_lookaround
          plugin: vln_agent/CancelLookaround
          blocking: true
    - id: rgbd
      definition: ../plugins/tools/rgbd/tool.json
      settings:
        service_name: /rgbd_image_queue/get_image
        camera_info_topic: /camera/color/camera_info
        fixed_frame: map
        timeout_sec: 2.0
        max_pairs: 8
        segmentation:
          warmup_on_initialize: true
          engine_directory: /home/yan/ros2_ws/src/scout_mini_vln/segment_tools/models/tensorrt/engines
          encoder_precision: tf32
          decoder_precision: fp16
          cuda_graph: true
      functions:
        - name: capture_pair
          plugin: vln_agent/CapturePair
          blocking: false
          settings:
            image_scale: 0.8
        - name: depth_project
          plugin: vln_agent/DepthProject
          blocking: false


session_manager:
  base_url: "http://192.168.3.25:8317/v1"
  api_key: "sk-local-1gHIUqOELWgeLmW5AocUxtxGo7DWRlUBed1xu-35"
  model: "gpt-6.1-terra"
  store: true
  reasoning_effort: low
  max_output_tokens: 8192
  parallel_tool_calls: true
  prompt_cache_key: "scout-mini-vln"
  max_request_hz: 1.0
  request_timeout_sec: 0
  stream_output: true
  context:
    budget_tokens: 256000
    compact_ratio: 0.8


# 用户渠道分别选择传输字段；同步 exchange，无交互工作线程。
user_interaction:
  channels:
    - id: ros_ui
      plugin: vln_agent/RosTopicInterface
      transmit:
        request: true
        response:
          messages: true
          function_calls: true
          tool_outputs: true
          stream: true
        tools:
          definitions: true
          status: true
          queue: true
          finished_calls: true
        session:
          request_status: true
          context_status: true
      include_images: false
      settings:
        send_topic: /vln/user_output
        receive_topic: /vln/user_input

event_manager:
  receive_topic: /vln/robot_event
