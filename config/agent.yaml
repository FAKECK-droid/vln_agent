tool_manager:
  service_name: /vln/tool_call
  max_concurrent_calls: 4
  max_pending_calls: 64
  groups:
    - id: navigation
      definition: ../plugins/tools/navigation/tool.json
      settings:
        action_name: /navigate_to_pose
        navigate_through_poses_action_name: /navigate_through_poses
        navigate_through_poses_behavior_tree: /home/yan/ros2_ws/src/scout_mini_vln/vln_behavior_tree/behavior_trees/vln_navthroughgoals.xml
        local_costmap_service: /local_costmap/get_costmap
        global_costmap_service: /global_costmap/get_costmap
        map_frame: map
        base_frame: base_link
        costmap_timeout_sec: 2.0
        image_size: 512
        max_environments: 8
        max_pixel_goals: 16  # 单次多点像素导航的最大点数，必须为正整数
        trail:
          sample_interval_sec: 0.5
          min_distance_m: 0.1
          max_points: 2000
      functions:
        - name: start_navigation
          plugin: vln_agent/StartNavigation
          blocking: true
        - name: get_navigation_feedback
          plugin: vln_agent/GetNavigationFeedback
          blocking: false
        - name: cancel_navigation
          plugin: vln_agent/CancelNavigation
          blocking: true
        - name: get_robot_state
          plugin: vln_agent/GetRobotState
          blocking: false
          settings:
            rgbd_resource: rgbd/rgbd
        - name: get_surroundings
          plugin: vln_agent/GetSurroundings
          blocking: false
        - name: navigate_to_pixel_start_navigation
          plugin: vln_agent/NavigateToPixelStartNavigation
          blocking: true
        - name: navigate_through_pixels_start_navigation
          plugin: vln_agent/NavigateThroughPixelsStartNavigation
          blocking: true
        - name: navigate_to_objects
          plugin: vln_agent/NavigateToObjects
          blocking: true
          settings:
            rgbd_resource: rgbd/rgbd
        - name: navigate_to_objects_surround
          plugin: vln_agent/NavigateToObjectsSurround
          blocking: true
          settings:
            rgbd_resource: rgbd/rgbd
        - name: lookaround
          plugin: vln_agent/Lookaround
          blocking: false
          settings:
            pause_sec: 0.3
            tile_size: 512
            gap_size: 12
            rgbd_resource: rgbd/rgbd
    - id: rgbd
      definition: ../plugins/tools/rgbd/tool.json
      settings:
        service_name: /rgbd_image_queue/get_image
        camera_info_topic: /camera/color/camera_info
        fixed_frame: map
        timeout_sec: 2.0
        max_pairs: 64
        segmentation:
          warmup_on_initialize: true
          engine_directory: /home/yan/ros2_ws/src/scout_mini_vln/segment_tools/models/tensorrt/engines
          encoder_precision: fp16
          decoder_precision: fp16
          cuda_graph: true
      functions:
        - name: capture_pair
          plugin: vln_agent/CapturePair
          blocking: false
          settings:
            image_scale: 0.6
        - name: capture_pair_sequence
          plugin: vln_agent/CapturePairSequence
          blocking: true
          settings:
            image_scale: 0.5
            max_batch_pairs: 5
        - name: depth_project
          plugin: vln_agent/DepthProject
          blocking: false
        - name: depth_project_surround
          plugin: vln_agent/DepthProjectSurround
          blocking: false


session_manager:
  base_url: "http://192.168.3.25:8317/v1"
  api_key: "sk-local-1gHIUqOELWgeLmW5AocUxtxGo7DWRlUBed1xu-35"
  model: "gpt-6.2-sol"
  store: true
  reasoning_effort: low
  max_output_tokens: 8192
  parallel_tool_calls: true
  prompt_cache_key: "scout-mini-vln"
  max_request_hz: 1.0
  request_timeout_sec: 0
  stream_output: true
  context:
    budget_tokens: 256000
    compact_ratio: 0.8


# 用户渠道分别选择传输字段；同步 exchange，无交互工作线程。
user_interaction:
  channels:
    - id: ros_ui
      plugin: vln_agent/RosTopicInterface
      transmit:
        request: true
        response:
          messages: true
          function_calls: true
          tool_outputs: true
          stream: true
        tools:
          definitions: true
          status: true
          queue: true
          finished_calls: true
        session:
          request_status: true
          context_status: true
      include_images: false
      settings:
        send_topic: /vln/user_output
        receive_topic: /vln/user_input

event_manager:
  receive_topic: /vln/robot_event
